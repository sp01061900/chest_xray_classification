data:
  raw_dir: data/raw/amia-public-challenge-2026
  metadata_csv: data/processed/metadata.csv
  processed_dir: data/processed
  split_dir: data/splits
  stats_mean: data/processed/mean.npy
  stats_std: data/processed/std.npy
  pos_weight: data/processed/pos_weight.npy
  use_cache: false
  cache_dir: data/processed/cache_224
training:
  seed: 42
  batch_size: 16
  num_workers: 4
  epochs_head: 3
  epochs_finetune: 17
  optimizer: adamw
  lr_head: 0.001
  lr_backbone: 1.0e-05
  weight_decay: 0.0001
  early_stopping_patience: 5
  monitor: macro_roc_auc
  monitor_mode: max
  amp: true
  clip_grad_norm: 1.0
  use_pos_weight: true
evaluation:
  default_threshold: 0.5
  threshold_grid:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
output:
  checkpoints_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
  plots_dir: outputs/plots
experiment_name: densenet121_torchvision
model:
  name: densenet121
  num_classes: 14
  pretrained: true
  input_channels: 3
  dropout: 0.2
preprocessing:
  image_size: 224
  normalization: imagenet
  augmentation: true
